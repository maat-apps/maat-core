name: App PR preview cleanup

# Reusable: removes a closed PR's pr-<n>/ preview from the shared
# `pages-content` branch (see app-deploy-preview.yml) and redeploys Pages.
# A no-op when the branch doesn't exist yet.
#
# An app calls it from its own .github/workflows/pr-preview-cleanup.yml on
# `pull_request: types: [closed]` (closing a PR has nothing to validate, so
# this is separate from CI), with permissions contents/pages: write +
# id-token: write and the `pages` concurrency group:
#
#   jobs:
#     cleanup:
#       uses: maat-apps/maat-core/.github/workflows/app-pr-preview-cleanup.yml@main
#       with:
#         pr-number: ${{ github.event.pull_request.number }}
on:
  workflow_call:
    inputs:
      pr-number:
        description: "Closed PR whose preview to remove"
        type: number
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ inputs.pr-number }}
    steps:
      - name: Checkout pages-content workspace
        uses: actions/checkout@v5
        with:
          path: pages-content
          fetch-depth: 0

      - name: Switch to pages-content branch
        working-directory: pages-content
        run: |
          git fetch origin pages-content:refs/remotes/origin/pages-content || true
          git show-ref --verify --quiet refs/remotes/origin/pages-content && git checkout pages-content || exit 0

      - name: Remove this PR's preview subdirectory
        run: rm -rf "pages-content/pr-$PR_NUM"

      - name: Commit and push pages-content
        working-directory: pages-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove preview for PR #$PR_NUM" --allow-empty
          git push origin HEAD:pages-content

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Remove git metadata before upload
        run: rm -rf pages-content/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-content

  deploy:
    needs: cleanup
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ inputs.pr-number }}/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
