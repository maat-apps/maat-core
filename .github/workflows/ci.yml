name: CI

# One job: lint, formatting, typecheck, unit tests and package builds are
# all cheap here. Every workspace's typecheck/test/build runs through the
# root scripts' `--workspaces --if-present`, so a new package is covered
# without editing this file.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build packages
        run: npm run build

      # Same bar as the apps' CI (app-ci.yml): high and above only.
      - name: Audit
        run: npm audit --audit-level=high
